[build]
builder = "dockerfile"

[[services]]
name = "backend"
source = "backend"
dockerfile = "Dockerfile"

[services.deploy]
startCommand = "/app/entrypoint.sh"
healthcheckPath = "/health"
healthcheckTimeout = 30

[[services]]
name = "frontend"
source = "frontend"
dockerfile = "Dockerfile"

[services.deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 30
